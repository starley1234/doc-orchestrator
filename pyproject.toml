# Настройки инструментов разработки. Зависимости — в requirements.txt / requirements-dev.txt.

[tool.pytest.ini_options]
asyncio_mode = "auto"  # async-тесты и фикстуры работают без декораторов
asyncio_default_fixture_loop_scope = "function"  # свой event loop на каждый тест
pythonpath = ["."]     # пакеты app и mocks импортируются от корня репозитория
testpaths = ["tests"]

[tool.ruff]
line-length = 110
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "SIM", "ASYNC", "RUF"]
# Кириллица в строках, докстрингах и комментариях — норма для этого проекта
ignore = ["RUF001", "RUF002", "RUF003"]
