# Боевой сервер: оркестратор + Redis. ML-движки (docling-serve, mineru, paddle, ollama)
# разворачиваются отдельно, их адреса задаются в файле .env (образец — .env.example).
#
#   cp .env.example .env    # и указать адреса движков
#   docker compose -f docker-compose.prod.yml up -d --build

services:
  redis:
    image: redis:7-alpine
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  doc-orchestrator:
    build: .
    image: doc-orchestrator
    restart: unless-stopped
    ports:
      - "8000:8000"
    env_file: .env
    environment:
      REDIS_URL: redis://redis:6379/0  # Redis этого же стенда
    extra_hosts:
      # Движок, запущенный на портах самого сервера, доступен из контейнера как host.docker.internal
      - "host.docker.internal:host-gateway"
    depends_on:
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request as r; r.urlopen('http://127.0.0.1:8000/health', timeout=2)"]
      interval: 5s
      timeout: 3s
      retries: 10
