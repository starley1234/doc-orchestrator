# Локальный стенд: оркестратор + Redis + заглушки ML-движков.
# В проде укажите в .env адреса боевых контейнеров, а сервис mock-engines уберите.

services:
  redis:
    image: redis:7-alpine
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  mock-engines:
    build: ./mocks
    restart: unless-stopped
    ports:
      - "8001:8001"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request as r; r.urlopen('http://127.0.0.1:8001/health', timeout=2)"]
      interval: 5s
      timeout: 3s
      retries: 10

  doc-orchestrator:
    build: .
    restart: unless-stopped
    ports:
      - "8000:8000"
    # Файл .env необязателен: без него сервис работает с заглушками
    env_file:
      - path: .env
        required: false
    environment:
      # Адреса внутри сети compose; переопределяются одноимёнными переменными из .env
      REDIS_URL: ${REDIS_URL:-redis://redis:6379/0}
      DOCLING_URL: ${DOCLING_URL:-http://mock-engines:8001/docling}
      MINERU_URL: ${MINERU_URL:-http://mock-engines:8001/mineru}
      PADDLE_URL: ${PADDLE_URL:-http://mock-engines:8001/paddle}
      VLM_GATEWAY_URL: ${VLM_GATEWAY_URL:-http://mock-engines:8001/gateway}
      DLP_URL: ${DLP_URL:-http://mock-engines:8001/dlp}
    depends_on:
      redis:
        condition: service_healthy
      mock-engines:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request as r; r.urlopen('http://127.0.0.1:8000/health', timeout=2)"]
      interval: 5s
      timeout: 3s
      retries: 10
